<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" style="background: #0d1117; border-radius: 12px;">
  <defs>
    <!-- Hiệu ứng phát sáng cho hạt nhân -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Độ dốc tâm hạt nhân dương -->
    <radialGradient id="positive-core" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff85a1"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#b3003b"/>
    </radialGradient>

    <!-- Độ dốc cho đường sức điện trường -->
    <linearGradient id="field-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Mũi tên chỉ hướng điện trường đi ra xa -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8 z" fill="#38bdf8" opacity="0.85"/>
    </marker>
  </defs>

  <!-- Lưới nền không gian kỹ thuật số (tạo chiều sâu) -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <path d="M0 100 H600 M0 200 H600 M0 300 H600 M0 400 H600 M0 500 H600" />
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600" />
  </g>

  <!-- Các vòng tròn quỹ đạo năng lượng lan tỏa -->
  <circle cx="300" cy="300" r="120" fill="none" stroke="#ff3366" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="300" r="200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 12" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="360 300 300" to="0 300 300" dur="35s" repeatCount="indefinite"/>
  </circle>

  <!-- Đường sức điện trường hướng ra ngoài (Radial Electric Field Lines) -->
  <g fill="none" stroke="url(#field-line-grad)" stroke-width="2" marker-end="url(#arrow)">
    <!-- 12 tia hướng đều 360 độ -->
    <path d="M300 300 L300 60" />
    <path d="M300 300 L420 120" />
    <path d="M300 300 L540 300" />
    <path d="M300 300 L420 480" />
    <path d="M300 300 L300 540" />
    <path d="M300 300 L180 480" />
    <path d="M300 300 L60 300" />
    <path d="M300 300 L180 120" />
    
    <path d="M300 300 L360 80" />
    <path d="M300 300 L520 180" />
    <path d="M300 300 L520 420" />
    <path d="M300 300 L360 520" />
    <path d="M300 300 L240 520" />
    <path d="M300 300 L80 420" />
    <path d="M300 300 L80 180" />
    <path d="M300 300 L240 80" />
  </g>

  <!-- Hạt điện tích dương trung tâm -->
  <g filter="url(#glow)">
    <circle cx="300" cy="300" r="36" fill="url(#positive-core)"/>
    <circle cx="300" cy="300" r="36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Ký hiệu dấu cộng (+) chính giữa hạt nhân -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="286" y1="300" x2="314" y2="300" />
    <line x1="300" y1="286" x2="300" y2="314" />
  </g>
</svg>
