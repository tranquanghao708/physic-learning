<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background: #0d1117; border-radius: 12px; font-family: sans-serif;">
  <defs>
    <!-- Hiệu ứng phát sáng -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Độ dốc cho điện tích Q (Dương) -->
    <radialGradient id="grad-Q" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff85a1"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#b3003b"/>
    </radialGradient>

    <!-- Độ dốc cho điện tích thử q (Dương) -->
    <radialGradient id="grad-q-pos" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </radialGradient>

    <!-- Mũi tên lực F -->
    <marker id="arrow-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>

    <!-- Mũi tên đường sức -->
    <marker id="arrow-field" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f472b6"/>
    </marker>
  </defs>

  <!-- Lưới nền -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.35">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600"/>
  </g>

  <!-- Khung mô phỏng -->
  <rect x="40" y="50" width="720" height="500" rx="12" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Tiêu đề -->
  <text x="400" y="32" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">
    MÔ PHỎNG TÁC DỤNG LỰC CỦA ĐIỆN TRƯỜNG
  </text>

  <!-- Chú thích dưới -->
  <text x="400" y="575" text-anchor="middle" fill="#8b949e" font-size="13">
    Điện tích thử q (+) tiến gần Q (+) → Lực đẩy F tăng dần (F ∝ 1/r²)
  </text>

  <!-- Vùng chính -->
  <g transform="translate(400, 300)">

    <!-- Đường sức điện trường của Q dương (hướng ra ngoài) -->
    <g opacity="0.5" stroke="#f472b6" stroke-width="1.6" fill="none">
      <line x1="48" y1="0"   x2="195" y2="0"   marker-end="url(#arrow-field)"/>
      <line x1="-48" y1="0"  x2="-195" y2="0"  marker-end="url(#arrow-field)"/>
      <line x1="0" y1="48"   x2="0" y2="195"   marker-end="url(#arrow-field)"/>
      <line x1="0" y1="-48"  x2="0" y2="-195"  marker-end="url(#arrow-field)"/>
      <line x1="34" y1="34"  x2="138" y2="138" marker-end="url(#arrow-field)"/>
      <line x1="-34" y1="34" x2="-138" y2="138" marker-end="url(#arrow-field)"/>
      <line x1="34" y1="-34" x2="138" y2="-138" marker-end="url(#arrow-field)"/>
      <line x1="-34" y1="-34" x2="-138" y2="-138" marker-end="url(#arrow-field)"/>
    </g>

    <!-- Điện tích nguồn Q -->
    <g filter="url(#glow)">
      <circle cx="0" cy="0" r="42" fill="url(#grad-Q)"/>
      <text x="0" y="11" text-anchor="middle" fill="#ffffff" font-size="32" font-weight="bold">+</text>
      <text x="0" y="-58" text-anchor="middle" fill="#ff3366" font-size="17" font-weight="bold">Q</text>
    </g>

    <!-- Điện tích thử q + Vector lực F (di chuyển + thay đổi độ dài) -->
    <g filter="url(#glow)">
      <!-- Animation vị trí của q -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="290 0; 115 0; 290 0"
        keyTimes="0; 0.5; 1"
        dur="6s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
      
      <!-- Hình tròn q -->
      <circle cx="0" cy="0" r="20" fill="url(#grad-q-pos)"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">+</text>
      <text x="0" y="-30" text-anchor="middle" fill="#a3e635" font-size="14" font-weight="bold">q</text>

      <!-- Vector lực F (luôn hướng ra ngoài, dài dần khi lại gần) -->
      <g>
        <!-- Đường lực -->
        <line x1="24" y1="0" x2="70" y2="0"
              stroke="#38bdf8" stroke-width="4.5" marker-end="url(#arrow-force)">
          <animate
            attributeName="x2"
            values="70; 155; 70"
            keyTimes="0; 0.5; 1"
            dur="6s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        </line>

        <!-- Nhãn F di chuyển theo đầu mũi tên để không bị chèn -->
        <g>
          <animateTransform
            attributeName="transform"
            type="translate"
            values="45 0; 95 0; 45 0"
            keyTimes="0; 0.5; 1"
            dur="6s"
            repeatCount="indefinite"
            calcMode="spline"
            keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
          
          <!-- Nền mờ cho chữ để không bị đè -->
          <rect x="8" y="-28" width="52" height="36" rx="5" fill="#0d1117" opacity="0.75"/>
          
          <text x="34" y="-10" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">F</text>
          <text x="34" y="8" text-anchor="middle" fill="#7dd3fc" font-size="11">(Lực đẩy)</text>
        </g>
      </g>
    </g>

    <!-- Chú thích (góc trên trái, không chồng chéo) -->
    <g transform="translate(-370, -230)">
      <rect x="0" y="0" width="185" height="105" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      
      <circle cx="28" cy="28" r="11" fill="url(#grad-Q)"/>
      <text x="50" y="32" fill="#c9d1d9" font-size="13">Q : Điện tích nguồn (+)</text>
      
      <circle cx="28" cy="58" r="11" fill="url(#grad-q-pos)"/>
      <text x="50" y="62" fill="#c9d1d9" font-size="13">q : Điện tích thử (+)</text>
      
      <line x1="17" y1="85" x2="39" y2="85" stroke="#f472b6" stroke-width="2.2" marker-end="url(#arrow-field)"/>
      <text x="50" y="89" fill="#c9d1d9" font-size="13">Đường sức điện trường</text>
    </g>
  </g>
</svg>